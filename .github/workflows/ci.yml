name: CI
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo ios=true >> "$GITHUB_OUTPUT"
            echo android=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          shared='^(src/|example/src/|example/[^/]+$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$|\.github/workflows/ci\.yml$|\.github/actions/)'
          matches() { grep -qE "$shared|$1" "$RUNNER_TEMP/changed" && echo true || echo false; }
          echo "ios=$(matches '^(ios/|example/ios/|[^/]+\.podspec$)')" >> "$GITHUB_OUTPUT"
          echo "android=$(matches '^(android/|example/android/)')" >> "$GITHUB_OUTPUT"
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run docs:build
      - run: |
          pnpm pack --pack-destination artifacts
          node scripts/check-package.mjs artifacts/*.tgz
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - run: ./gradlew :app:assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a
        working-directory: example/android
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true
          working-directory: example
      - id: xcode
        run: echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/build/CompilationCache.noindex
          key: ios-cas-${{ steps.xcode.outputs.build }}-${{ hashFiles('pnpm-lock.yaml', 'example/ios/Podfile.lock') }}-${{ hashFiles('ios/**', 'src/**', 'example/ios/**', '!example/ios/Pods/**', '*.podspec') }}
          restore-keys: ios-cas-${{ steps.xcode.outputs.build }}-${{ hashFiles('pnpm-lock.yaml', 'example/ios/Podfile.lock') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/ios/Pods
          key: ios-pods-${{ hashFiles('example/ios/Podfile.lock') }}
      - run: bundle exec pod install --project-directory=ios
        working-directory: example
      - run: >-
          xcodebuild -workspace ios/ReservedRegionsExample.xcworkspace
          -scheme ReservedRegionsExample -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          COMPILATION_CACHE_ENABLE_CACHING=YES build
        working-directory: example
